name: Build image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # native arm64, so the image's chroot runs without qemu emulation
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out the client
        uses: actions/checkout@v4
        with:
          repository: Pi-Tray/client
          path: client

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build the client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y parted xz-utils

      - name: Build the image
        run: sudo ./build/build-image.sh client/dist out

      - name: Point the Imager list at this release
        if: startsWith(github.ref, 'refs/tags/')
        run: sudo sed -i "s|PLACEHOLDER_URL|https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}|" out/os_list.json

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-tray-image
          path: out/*
          # already xz compressed
          compression-level: 0

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --title "${{ github.ref_name }}" --generate-notes
